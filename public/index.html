<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidsMotion - 아동 체력 분석 시스템</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo {
            background: linear-gradient(45deg, #7B5CFF, #9C7AFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #7B5CFF, #9C7AFF);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .status {
            background: #f0f9ff;
            border: 1px solid #0284c7;
            color: #0284c7;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">KidsMotion</div>
        <div class="subtitle">아동 체력 분석 시스템</div>
        
        <div class="status">
            🚀 사이트가 정상적으로 작동 중입니다!
        </div>
        
        <a href="/admin" class="btn">📊 관리자 페이지</a>
        <a href="#" class="btn" onclick="showMeasurement()">📋 체력 측정</a>
        
        <div style="margin-top: 30px; color: #888; font-size: 0.9em;">
            <p>✨ 개인화된 운동 추천 시스템</p>
            <p>📱 5분 간편 측정</p>
            <p>🎯 과학적 정확도</p>
        </div>
    </div>

    <script>
        function showMeasurement() {
            alert('체력 측정 기능이 곧 활성화됩니다!\n관리자 페이지에서 초대 코드를 생성해주세요.');
        }
        
        // 배포 상태 확인
        console.log('KidsMotion 사이트 로드 완료');
        console.log('현재 시간:', new Date().toLocaleString('ko-KR'));
    </script>
</body>
</html>
